# One-off test night: read two ENNDAL GAMES sets and match them to Scryfall
# (dev/probes/enndal_test.py). Runs only on pushes to this branch.
name: ENNDAL test night
on:
  push:
    branches: [claude/project-thread-2174h4]
    paths: [dev/probes/enndal_test.go, dev/probes/enndal_diag.go]   # push this file to start the run, at night Japan time
permissions:
  contents: write
concurrency: { group: enndal-test, cancel-in-progress: false }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test night
        run: |
          mkdir -p probe_out
          if git diff --name-only HEAD~1 HEAD | grep -q enndal_diag.go; then
            ( set -x; python3 dev/probes/enndal_diag.py ) > probe_out/enndal_diag_log.txt 2>&1 || true
          else
            ( set -x; python3 dev/probes/enndal_test.py ) > probe_out/enndal_test_log.txt 2>&1 || true
          fi
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out
          git commit -m "ENNDAL test night result [skip ci]" && git push || echo "nothing to commit"
