# Temporary: builds the new cheapest-price file once from Scryfall's daily export on a
# GitHub runner, so the site's deck prices can be checked with real numbers. Removed after.
name: Probe cheapest prices
on: push
permissions: { contents: write }
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-0bvakb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          mkdir -p probe_out
          ( python3 - <<'PY'
          import gzip, json, build_prices as b
          cheap = {}
          n = 0
          for card in b.iter_cards(b.bulk_url()):
              n += 1
              if card.get("lang", "en") == "en":
                  b.note_cheapest(cheap, card)
          b.finish_cheapest(cheap)
          rows = {k: v for k, v in cheap.items() if v[0] is not None or v[1] is not None or v[2]}
          b.write_gz("probe_out/cheap.json.gz", {"version": 1, "date": "probe", "fields": ["usd", "eur", "arena"], "cards": rows})
          print(n, "printings,", len(rows), "cards")
          for k in ("Lightning Bolt", "Island", "Steam Vents", "Sleight of Hand", "Kaito, Bane of Nightmares", "Hearth Elemental // Stoke Genius"):
              print(k, rows.get(k))
          PY
          ) > probe_out/log.txt 2>&1 || true
          cat probe_out/log.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe_out && git commit -m "probe result [skip ci]" && git push
