# One-off helper for translating the combos into Japanese: lists the words
# and sentences Commander Spellbook uses and saves them in tools/.
name: Export combo terms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/combo_terms.py]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/combo_terms.py
      - name: Save the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/combo_terms.json.gz
          git commit -m "Combo terms for translation" && git push || echo "nothing new"
