# One-off helper: a look at the published shop data (saved in tools/sample/).
name: Sample the published shop data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/sample_quotes.py]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/sample_quotes.py
      - name: Save the sample
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sample
          git commit -m "Sample of the published shop data" && git push || echo "nothing new"
