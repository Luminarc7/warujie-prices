# One-off: read some Japanese shops' terms and contact pages (dev/probes/shop_terms.py).
name: Shop terms check
on:
  push:
    branches: [claude/project-thread-2174h4]
    paths: [dev/probes/shop_terms.py]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p probe_out
          python3 dev/probes/shop_terms.py > probe_out/shop_terms_log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out
          git commit -m "Shop terms check result [skip ci]" && git push || echo "nothing to commit"
