# One-off helper: which Scryfall Tagger tags exist (saved in tools/probe/).
name: Probe tags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_tags.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: python3 tools/probe_tags.py
      - name: Save the summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe
          git commit -m "Tag probe" && git push || echo "nothing new"
