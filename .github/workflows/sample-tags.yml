# One-off helper: a summary of the published role tags in tools/sample/
# (to check what the site reads). Removed afterwards.
name: Sample tags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sample-tags.yml]

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Summarise the published tags
        run: |
          curl -sSf "https://luminarc7.github.io/warujie-prices/t/tags.json.gz?$(date +%s)" -o /tmp/tags.json.gz
          python3 - <<'PY'
          import gzip, json, collections
          d = json.loads(gzip.decompress(open('/tmp/tags.json.gz', 'rb').read()))
          c = collections.Counter(d['tags'][i] for row in d['cards'] for i in row[2:])
          out = {k: d[k] for k in d if k != 'cards'}
          out.update(n_cards=len(d['cards']), size=len(open('/tmp/tags.json.gz', 'rb').read()), per_tag=dict(sorted(c.items())))
          json.dump(out, open('tools/sample/published.json', 'w'), indent=1)
          PY
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sample
          git commit -m "Summary of the published role tags" && git push || echo "nothing new"
