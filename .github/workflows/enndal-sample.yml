# One-off: fetch a small sample of ENNDAL GAMES pages (dev/probes/enndal_sample.py)
# and commit them back to this branch. Runs only on pushes to this branch.
name: ENNDAL sample
on:
  push:
    branches: [claude/project-thread-2174h4]
    paths: [dev/probes/enndal_sample.py, .github/workflows/enndal-sample.yml]
permissions:
  contents: write
concurrency: { group: enndal-sample, cancel-in-progress: false }
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch sample
        run: |
          mkdir -p probe_out
          ( set -x; python3 dev/probes/enndal_sample.py ) > probe_out/enndal_log.txt 2>&1 || true
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out
          git commit -m "ENNDAL sample result [skip ci]" && git push || echo "nothing to commit"
